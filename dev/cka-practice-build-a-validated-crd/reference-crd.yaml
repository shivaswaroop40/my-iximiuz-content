# Reference solution for the "Build a Validated CRD" challenge.
# Used by run-tests.sh to prove every verify task passes against a real kube-apiserver.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupschedules.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    kind: BackupSchedule
    plural: backupschedules
    singular: backupschedule
    shortNames: [bks]
    categories: [platform]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Schedule
      type: string
      jsonPath: .spec.schedule
    - name: Method
      type: string
      jsonPath: .spec.method
    - name: Keep
      type: integer
      jsonPath: .spec.retention.keepLast
    - name: Suspended
      type: boolean
      jsonPath: .spec.suspend
    - name: Last Backup
      type: date
      jsonPath: .status.lastBackupTime
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [schedule, source]
            x-kubernetes-validations:
            - rule: "self.method != 'restic' || has(self.repository)"
              message: "repository is required when method is restic"
            properties:
              schedule:
                type: string
                pattern: '^(\S+\s+){4}\S+$'
              source:
                type: object
                required: [pvcName]
                properties:
                  pvcName:
                    type: string
                    minLength: 1
              method:
                type: string
                enum: [snapshot, restic]
                default: snapshot
              repository:
                type: string
              retention:
                type: object
                default: {}
                properties:
                  keepLast:
                    type: integer
                    minimum: 1
                    maximum: 30
                    default: 7
              suspend:
                type: boolean
                default: false
          status:
            type: object
            properties:
              lastBackupTime:
                type: string
                format: date-time
              lastBackupResult:
                type: string
