---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: pets.zoo.example.com
spec:
  group: zoo.example.com
  names:
    categories:
    - zoo
    kind: Pet
    listKind: PetList
    plural: pets
    shortNames:
    - pt
    singular: pet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.species
      name: Species
      type: string
    - jsonPath: .status.face
      name: Face
      type: string
    - jsonPath: .status.mood
      name: Mood
      type: string
    - jsonPath: .spec.toy
      name: Toy
      type: string
    - jsonPath: .spec.lastFedAt
      name: Last Fed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              diet:
                default: {}
                properties:
                  feedEvery:
                    default: 10m
                    description: How often the pet needs food, e.g. "10m" or "6h".
                    maxLength: 10
                    pattern: ^[0-9]+(s|m|h)$
                    type: string
                    x-kubernetes-validations:
                    - message: feedEvery must be between 1s and 8760h (a year)
                      rule: duration(self) >= duration('1s') && duration(self) <=
                        duration('8760h')
                  food:
                    default: snacks
                    maxLength: 20
                    type: string
                type: object
              lastFedAt:
                description: When the pet was last fed. Feed it by setting this to
                  the current time.
                format: date-time
                type: string
              species:
                enum:
                - cat
                - dog
                - dragon
                - cactus
                type: string
              toy:
                maxLength: 20
                type: string
            required:
            - species
            type: object
            x-kubernetes-validations:
            - message: cacti don't play with toys
              rule: self.species != 'cactus' || !has(self.toy)
            - message: 'dragons eat at most once an hour: diet.feedEvery must be at
                least 1h'
              rule: self.species != 'dragon' || duration(self.diet.feedEvery) >= duration('1h')
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              face:
                type: string
              mood:
                description: Happy, Hungry or RanAway.
                type: string
              observedGeneration:
                description: The .metadata.generation the controller last acted on.
                format: int64
                type: integer
              podName:
                description: The Pod the pet lives in. Empty if it ran away.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
