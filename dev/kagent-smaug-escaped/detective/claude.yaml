# A real model. Create its key Secret first, without echoing the key:
#   read -rs KEY && kubectl -n kagent create secret generic kagent-anthropic --from-literal=ANTHROPIC_API_KEY="$KEY"; unset KEY
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: claude
  namespace: kagent
spec:
  provider: Anthropic
  model: claude-haiku-4-5
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
