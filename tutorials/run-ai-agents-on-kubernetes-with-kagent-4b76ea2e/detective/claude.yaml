# A real model. Create its key Secret first, without echoing the key:
#   read -rsp "Anthropic API key: " KEY && echo && kubectl -n kagent create secret generic kagent-anthropic --from-literal=ANTHROPIC_API_KEY="$KEY"; unset KEY
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: claude
  namespace: kagent
spec:
  provider: Anthropic
  model: claude-sonnet-5-5   # any current Claude model id works here
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
